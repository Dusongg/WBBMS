app:
  name: bookadmin
  env: development

server:
  host: 0.0.0.0
  port: 8888
  read-timeout-seconds: 10
  write-timeout-seconds: 10
  shutdown-timeout-seconds: 10

mysql:
  path: 127.0.0.1:3306
  db-name: bookadmin
  username: root
  password: root
  config: charset=utf8mb4&parseTime=True&loc=Local
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: true

redis:
  enabled: true
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool-size: 100
  min-idle-conns: 10
  max-retries: 3
  dial-timeout: 5
  read-timeout: 3
  write-timeout: 3

jwt:
  secret: bookadmin-secret-key-change-in-production
  expire-hours: 24
  issuer: bookadmin

log:
  level: info
  file: ./log/app.log
  max-size: 10
  max-backups: 5
  max-age: 30
  compress: false

worker:
  enabled: true
  pool-size: 5
  consumer-group: sync-group
  batch-size: 100
  batch-timeout-seconds: 5
  block-timeout-seconds: 1
  reclaim-interval-seconds: 15
  min-idle-seconds: 30
  max-retry: 5
  dead-letter-stream: stream:dead-letter:sync
  consumer-prefix: worker

cron:
  enabled: true
  use-distributed-lock: true
  lock-ttl-seconds: 600

metrics:
  enabled: true

tracing:
  enabled: true
  endpoint: localhost:4317
  service: bookadmin-api

resilience:
  rate-limit:
    enabled: true
    rps: 100
    burst: 50
    per-ip: true
  circuit-breaker:
    enabled: true
    max-requests: 3
    interval: 10
    timeout: 30
    failure-threshold: 5

migration:
  auto-migrate: false  # 改为 false 跳过启动时自动迁移；需要时执行: go run main.go --mode=migrate

security:
  cors-allowed-origins:
    - http://localhost:8080
  seed-default-users: true

