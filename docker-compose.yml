
x-app-env: &app-env
  APP_ENV: production
  SERVER_PORT: 8888
  MYSQL_PATH: mysql:3306
  MYSQL_DB_NAME: ${MYSQL_DATABASE:-bookadmin}
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET:-bookadmin-change-me}
  SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost}
  TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317

x-app-base: &app-base
  image: bookadmin:latest
  restart: unless-stopped
  environment:
    <<: *app-env
  networks:
    - bookadmin-network
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    jaeger:
      condition: service_started

services:

  mysql:
    image: mysql:8.0
    container_name: bookadmin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookadmin}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bookadmin-network

  redis:
    image: redis:7-alpine
    container_name: bookadmin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - bookadmin-network

  migrate:
    <<: *app-base
    container_name: bookadmin-migrate
    restart: "no"
    command: ["-mode=migrate"]
    environment:
      <<: *app-env
      MIGRATION_AUTO_MIGRATE: "true"
      SECURITY_SEED_DEFAULT_USERS: "true"

  api1:
    <<: *app-base
    container_name: bookadmin-api-1
    command: ["-mode=api"]
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "api-1"

  api2:
    <<: *app-base
    container_name: bookadmin-api-2
    command: ["-mode=api"]
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "api-2"

  api3:
    <<: *app-base
    container_name: bookadmin-api-3
    command: ["-mode=api"]
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "api-3"

  worker:
    <<: *app-base
    container_name: bookadmin-worker
    command: ["-mode=worker"]

  scheduler:
    <<: *app-base
    container_name: bookadmin-scheduler
    command: ["-mode=scheduler"]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: bookadmin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - bookadmin-network

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: bookadmin-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - bookadmin-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: bookadmin-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - bookadmin-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: bookadmin-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - bookadmin-network

volumes:
  mysql_data:
  redis_data:
  grafana_data:

networks:
  bookadmin-network:
    driver: bridge
